<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0a14">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="The Hood">
<meta name="description" content="The Hood: your social life as a living GTA-style map.">
<title>The Hood</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800;900&family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@500;600;700&display=swap">
<style>
/* Layout: one phone-sized column. Top bar (title, your Respect, Safehouse,
   menu). Then the Hood Pulse, the living map with three big buttons under it,
   today's missions, and every homie grouped by how close they are. Tapping a
   homie anywhere opens their sheet with the quick actions. Desktop gets the
   same column, centred. */
:root {
  color-scheme: dark;
  --night: #0d0a14;
  --panel: #1b1428;
  --line: rgba(236, 222, 255, .1);
  --line-2: rgba(236, 222, 255, .2);
  --ink: #f7f2ff;
  --smog: #b3a8c9;
  --dim: #7a7091;
  --shade: #05040a;
  --neon: #ff3d7f;
  --flare: #ff9b3d;
  --gold: #ffd166;
  --palm: #2ee6c8;
  --cash: #7cf29a;
  --dusk: #9a6bff;
  --s-golden: #ffd166;
  --s-dope: #ff7a3d;
  --s-neutral: #c9c2d9;
  --s-watch: #ffd400;
  --s-toxic: #b6ff3c;
  --font-display: "Big Shoulders Display", "Anton", Impact, "Arial Narrow Bold", sans-serif;
  --font-hud: "Barlow Condensed", "Roboto Condensed", "Arial Narrow", sans-serif;
  --font-body: "Barlow", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --snap: cubic-bezier(.2, 1.4, .4, 1);
  --glide: cubic-bezier(.2, .8, .2, 1);
  --stripes: repeating-linear-gradient(-45deg, #ffd400 0 12px, #111 12px 24px);
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; background: var(--night); }
body { margin: 0; min-height: 100vh; min-height: 100dvh; background: var(--night); color: var(--ink); font: 500 16px/1.45 var(--font-body); -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; overflow-x: hidden; }
body::before { content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none; background: radial-gradient(110% 50% at 85% -10%, rgba(255, 61, 127, .18), transparent 60%), radial-gradient(80% 45% at -10% 0%, rgba(110, 60, 255, .16), transparent 60%); }
body.in-safehouse::before { background: radial-gradient(90% 60% at 50% 0%, rgba(46, 230, 200, .16), transparent 70%); }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; touch-action: manipulation; }
a { color: var(--palm); }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.sr { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; margin: -1px; padding: 0; border: 0; }
.kicker { margin: 0; font: 800 12.5px/1.1 var(--font-hud); letter-spacing: .18em; text-transform: uppercase; color: var(--smog); }
.fine { margin: 0; font-size: 14px; color: var(--dim); line-height: 1.4; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

/* top bar */
.top { position: sticky; top: 0; z-index: 30; background: linear-gradient(180deg, rgba(13, 10, 20, .97), rgba(13, 10, 20, .86)); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); padding-top: env(safe-area-inset-top, 0px); }
.top-in { max-width: 560px; margin: 0 auto; display: flex; align-items: center; gap: 8px; padding: 9px 14px; }
.logo { margin-right: auto; font: 900 30px/.9 var(--font-display); text-transform: uppercase; letter-spacing: .02em; background: linear-gradient(180deg, #fff4c8 8%, var(--gold) 50%, var(--flare) 96%); -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-stroke: 1.2px var(--shade); filter: drop-shadow(2px 3px 0 rgba(255, 61, 127, .9)); }
.pill { display: inline-flex; align-items: center; gap: 6px; min-height: 42px; padding: 0 12px; border-radius: 999px; border: 2px solid rgba(255, 209, 102, .45); background: rgba(255, 209, 102, .08); color: var(--gold); white-space: nowrap; }
.pill small { font: 800 11px/1 var(--font-hud); letter-spacing: .14em; text-transform: uppercase; }
.pill b { font: 900 22px/1 var(--font-display); }
.pill.bump { animation: bump .5s var(--snap); }
@keyframes bump { 40% { transform: scale(1.18); } }
.icon-btn { width: 42px; height: 42px; flex: none; display: grid; place-items: center; border-radius: 50%; border: 2px solid var(--line-2); background: rgba(255, 255, 255, .04); font-size: 19px; padding: 0; }
.icon-btn.house { border-color: rgba(46, 230, 200, .55); }
.bat-pill { display: inline-flex; align-items: center; gap: 4px; min-height: 42px; padding: 0 10px; border-radius: 999px; border: 2px solid color-mix(in srgb, var(--bc) 55%, transparent); background: color-mix(in srgb, var(--bc) 10%, transparent); color: var(--bc); font: 900 19px/1 var(--font-display); white-space: nowrap; }
@media (max-width: 420px) { .pill small { display: none; } .logo { font-size: 25px; } .top-in { gap: 6px; padding-inline: 12px; } }
/* social battery, slim */
.mini { display: flex; align-items: center; gap: 8px; min-width: 0; min-height: 50px; padding: 7px 10px; border-radius: 12px; border: 1px solid color-mix(in srgb, var(--bc, var(--gold)) 40%, transparent); background: color-mix(in srgb, var(--bc, var(--gold)) 8%, rgba(0, 0, 0, .25)); text-align: left; color: var(--ink); }
.mini .mi { font-size: 20px; flex: none; }
.mini .mt { display: grid; gap: 3px; min-width: 0; flex: 1; }
.mini b { font: 800 14px/1.1 var(--font-hud); letter-spacing: .06em; text-transform: uppercase; color: var(--bc, var(--gold)); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mini small { font-size: 12.5px; color: var(--smog); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mbar { display: block; height: 5px; border-radius: 3px; background: rgba(255, 255, 255, .1); overflow: hidden; }
.mbar i { display: block; height: 100%; border-radius: 3px; background: var(--bc); }
.ci-compact { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.ci-compact .kicker { flex: 1 0 100%; }
.ci-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; flex: 1; }
.cib { min-height: 44px; padding: 0 4px; border-radius: 12px; border: 2px solid color-mix(in srgb, var(--bc) 50%, transparent); background: color-mix(in srgb, var(--bc) 8%, transparent); color: var(--bc); font: 800 14px/1 var(--font-hud); letter-spacing: .04em; text-transform: uppercase; white-space: nowrap; }
.cib:active { transform: translateY(2px); }
.cells { display: grid; grid-template-columns: repeat(10, 1fr); gap: 2px; height: 12px; grid-column: 1 / -1; margin-top: 4px; }
.cells i { border-radius: 2px; background: rgba(255, 255, 255, .08); }
.cells i.on { background: var(--bc); box-shadow: 0 0 6px color-mix(in srgb, var(--bc) 60%, transparent); }
.checkin { display: grid; gap: 8px; }
.checkin-btns { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.ci { display: grid; justify-items: center; gap: 3px; min-height: 74px; padding: 8px 2px; border-radius: 14px; border: 2px solid color-mix(in srgb, var(--bc) 50%, transparent); background: color-mix(in srgb, var(--bc) 8%, transparent); font: 800 14px/1 var(--font-hud); letter-spacing: .06em; text-transform: uppercase; color: var(--bc); }
.ci span { font-size: 24px; }
.ci small { font: 600 11px/1.15 var(--font-body); letter-spacing: 0; text-transform: none; color: var(--smog); text-align: center; }
.ci[aria-pressed="true"] { background: color-mix(in srgb, var(--bc) 24%, transparent); border-color: var(--bc); }
.ci:active { transform: translateY(2px); }
.range { margin: 10px 0 0; display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; padding: 10px 12px; border-radius: 12px; background: rgba(255, 255, 255, .04); font-size: 15px; }
.risk { margin-top: 10px; display: grid; gap: 6px; padding: 11px 13px; border-radius: 12px; border: 3px solid transparent; background: linear-gradient(#17140a, #17140a) padding-box, var(--stripes) border-box; }
.risk-top { display: flex; justify-content: space-between; font: 800 14px/1 var(--font-hud); letter-spacing: .1em; text-transform: uppercase; color: #ffd400; }
.risk-bar { height: 12px; border-radius: 999px; background: rgba(255, 255, 255, .08); overflow: hidden; }
.risk-bar i { display: block; height: 100%; border-radius: 999px; background: linear-gradient(90deg, #ffd400, var(--s-toxic)); }
.risk p { margin: 0; font-size: 14.5px; color: var(--smog); }
.toxic-banner { margin-top: 10px; padding: 12px 13px; border-radius: 12px; border: 3px solid transparent; background: linear-gradient(#141a08, #141a08) padding-box, var(--stripes) border-box; font-size: 15px; }
.toxic-banner b { color: var(--s-toxic); }
/* the stash jar */
.stash-row { display: grid; grid-template-columns: minmax(120px, 44%) minmax(0, 1fr); gap: 14px; align-items: center; }
#jar { width: 100%; aspect-ratio: 200 / 250; display: block; }
.stash-info { display: grid; gap: 8px; }
.stash-n { margin: 0; font: 900 44px/.9 var(--font-display); color: var(--gold); }
.stash-n small { display: block; font: 800 12px/1.2 var(--font-hud); letter-spacing: .16em; text-transform: uppercase; color: var(--smog); }
.loot-counts { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.loot-counts span { display: flex; align-items: center; gap: 6px; font: 800 17px/1 var(--font-hud); }
.loot-counts svg, .loot-key svg, .kt svg { flex: none; }
.loot-key { display: flex; flex-wrap: wrap; gap: 6px 12px; justify-content: center; font: 700 13px/1 var(--font-hud); letter-spacing: .04em; color: var(--smog); }
.loot-key span { display: inline-flex; align-items: center; gap: 5px; }
/* ways of being in touch, as big tiles */
.kind-tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; margin-bottom: 14px; }
.kt { display: grid; justify-items: center; align-content: center; gap: 4px; min-height: 96px; padding: 8px 2px; border-radius: 16px; border: 2px solid var(--line-2); background: rgba(255, 255, 255, .04); text-align: center; }
.kt .ke { font-size: 30px; line-height: 1; }
.kt b { font: 800 15px/1 var(--font-hud); letter-spacing: .04em; text-transform: uppercase; }
.kt .kl { display: flex; align-items: center; gap: 3px; font: 700 11.5px/1.1 var(--font-hud); color: var(--smog); }
.kt[aria-checked="true"] { border-color: var(--gold); background: rgba(255, 209, 102, .14); box-shadow: 0 0 0 3px rgba(255, 209, 102, .15); }
.need-opts { display: grid; gap: 10px; }
.need { display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 12px; align-items: center; min-height: 76px; padding: 10px 14px; border-radius: 16px; border: 2px solid var(--line-2); background: rgba(255, 255, 255, .04); text-align: left; }
.need span:first-child { font-size: 34px; text-align: center; }
.need b { display: block; font: 900 22px/1 var(--font-display); text-transform: uppercase; }
.need small { color: var(--smog); font-size: 14px; }
.need.chose { border-color: rgba(255, 212, 0, .5); }
.feels { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.streak { display: flex; gap: 4px; margin-top: 6px; }
.streak i { flex: 1; height: 10px; border-radius: 3px; background: rgba(255, 255, 255, .1); }
.streak i.on { background: var(--palm); box-shadow: 0 0 6px rgba(46, 230, 200, .6); }
.qa .deal { border-color: var(--s-toxic); background: rgba(182, 255, 60, .08); }
.hitb small { font: 700 11.5px/1 var(--font-hud); letter-spacing: .02em; color: var(--smog); }
.in-safehouse .icon-btn.house { background: var(--palm); }

main, .safehouse { max-width: 560px; margin: 0 auto; padding: 10px 12px calc(env(safe-area-inset-bottom, 0px) + 32px); display: grid; gap: 14px; }
.panel { background: linear-gradient(180deg, var(--panel), #120d1b); border: 1px solid var(--line); border-radius: 18px; padding: 14px; display: grid; gap: 10px; }
.panel h2 { margin: 0; font: 900 24px/1 var(--font-display); text-transform: uppercase; letter-spacing: .02em; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.panel h2 span { font: 800 14px/1 var(--font-hud); letter-spacing: .1em; color: var(--smog); }

/* buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 16px; border-radius: 12px; border: 2px solid var(--line-2); background: rgba(255, 255, 255, .05); font: 800 15.5px/1 var(--font-hud); letter-spacing: .1em; text-transform: uppercase; text-decoration: none; color: var(--ink); }
.btn:active { transform: translateY(2px); }
.btn.primary { border: 0; background: linear-gradient(180deg, #ff5f96, var(--neon)); color: #fff; box-shadow: 0 4px 0 #a3134f; }
.btn.gold { border: 0; background: linear-gradient(180deg, #ffe08f, var(--gold)); color: #3d2300; box-shadow: 0 4px 0 #a36d00; }
.btn.palm { border: 0; background: linear-gradient(180deg, #6ff5df, var(--palm)); color: #032b25; box-shadow: 0 4px 0 #128a76; }
.btn.haz { border: 3px solid transparent; background: linear-gradient(#2a0f14, #2a0f14) padding-box, var(--stripes) border-box; color: #ffd400; }
.btn.ghost { border-color: transparent; background: transparent; color: var(--smog); }
.btn.danger { border-color: rgba(255, 80, 100, .5); color: #ff8094; }
.btn.small { min-height: 40px; padding: 0 12px; font-size: 14px; }
.btn.wide { width: 100%; }
.btn:disabled { opacity: .45; cursor: default; transform: none; }
.link { border: 0; background: none; padding: 8px 0; color: var(--palm); font: 700 15px/1.2 var(--font-body); text-decoration: underline; text-underline-offset: 3px; text-align: left; }
.field { width: 100%; min-width: 0; min-height: 50px; padding: 10px 14px; border-radius: 12px; border: 2px solid var(--line-2); background: var(--shade); color: var(--ink); font: 600 17px/1.3 var(--font-body); }
.field:focus { outline: none; border-color: var(--gold); }
.field::placeholder { color: var(--dim); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; min-height: 38px; padding: 0 12px; border-radius: 999px; border: 2px solid var(--line-2); background: rgba(255, 255, 255, .04); font: 700 14.5px/1 var(--font-hud); letter-spacing: .04em; color: var(--ink); white-space: nowrap; }
.chip[aria-pressed="true"], .chip[aria-checked="true"] { border-color: var(--cc, var(--gold)); background: color-mix(in srgb, var(--cc, var(--gold)) 20%, transparent); }
.chip.add { color: var(--gold); border-style: dashed; }
.scroll-x { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.scroll-x::-webkit-scrollbar { display: none; }

/* a homie token: emoji on a dark disc, ring in the status colour */
.tok { --sz: 46px; position: relative; flex: none; width: var(--sz); height: var(--sz); border-radius: 50%; display: grid; place-items: center; font-size: calc(var(--sz) * .5); line-height: 1; background: #1d1530; box-shadow: 0 0 0 3px var(--sc), 0 0 0 5px var(--shade); }
.tok.golden { box-shadow: 0 0 0 3px var(--sc), 0 0 0 5px var(--shade), 0 0 18px 4px rgba(255, 209, 102, .55); }
.tok.toxic { box-shadow: 0 0 0 3px var(--sc), 0 0 0 5px var(--shade), 0 0 18px 4px rgba(182, 255, 60, .45); }
.tok.faded { opacity: .45; }
.tok.silent { opacity: .35; filter: grayscale(1); }
.st { display: inline-flex; align-items: center; gap: 5px; padding: 4px 9px; border-radius: 999px; font: 800 12.5px/1 var(--font-hud); letter-spacing: .1em; text-transform: uppercase; color: var(--sc); background: color-mix(in srgb, var(--sc) 15%, transparent); border: 1px solid color-mix(in srgb, var(--sc) 45%, transparent); white-space: nowrap; }
.crew-tag { display: inline-flex; align-items: center; gap: 5px; padding: 4px 9px; border-radius: 999px; font: 800 12.5px/1 var(--font-hud); letter-spacing: .08em; text-transform: uppercase; background: color-mix(in srgb, var(--cc) 16%, transparent); color: var(--cc); white-space: nowrap; }
.stars { color: #fff; letter-spacing: 1px; font-size: 14px; text-shadow: 0 0 2px #000, 0 0 6px rgba(255, 255, 255, .4); white-space: nowrap; }
.stars i { font-style: normal; color: rgba(255, 255, 255, .18); text-shadow: none; }
.stars.hot { animation: wanted 1s steps(2) infinite; }
@keyframes wanted { 50% { opacity: .35; } }

/* hood pulse */
.pulse-row { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin: 0 -2px; padding: 2px; }
.pulse-row::-webkit-scrollbar { display: none; }
.ptile { flex: none; display: grid; justify-items: start; gap: 2px; min-width: 76px; padding: 7px 10px; border-radius: 14px; border: 2px solid color-mix(in srgb, var(--pc) 40%, transparent); background: color-mix(in srgb, var(--pc) 10%, transparent); text-align: left; }
.ptile b { font: 900 24px/1 var(--font-display); color: var(--pc); display: flex; align-items: center; gap: 6px; }
.ptile b span { font-size: 20px; }
.ptile small { font: 800 12px/1.1 var(--font-hud); letter-spacing: .1em; text-transform: uppercase; color: var(--smog); white-space: nowrap; }
.ptile[aria-pressed="true"] { background: color-mix(in srgb, var(--pc) 28%, transparent); border-color: var(--pc); }
.pulse-say { margin: 0; font-size: 15.5px; color: var(--smog); line-height: 1.4; }
.pulse-say b { color: var(--ink); }
.alert { display: grid; gap: 10px; padding: 13px; border-radius: 16px; border: 4px solid transparent; background: linear-gradient(#17140a, #17140a) padding-box, var(--stripes) border-box; animation: popin .4s var(--snap); }
.alert p { margin: 0; }
.alert b { color: #ffd400; }
@keyframes popin { from { transform: scale(.9); opacity: 0; } }

/* the map */
.map-card { padding: 8px; gap: 8px; }
/* inside Mission Possible Plus: the logo row becomes a full-screen button, and sheets and
   pop-ups stay inside the part of The Hood you can actually see (set from the parent page) */
.fs-btn { margin-right: auto; color: var(--gold); border-color: rgba(255, 209, 102, .45); }
body.embed.in-plus .logo { display: none; }
body.embed .top { top: var(--vis-top, 0px); }
body.embed .sheet { bottom: var(--vis-bottom, 0px); max-height: calc(var(--vis-h, 92dvh) - 8px); }
body.embed .scrim, body.embed .win { top: var(--vis-top, 0px); bottom: var(--vis-bottom, 0px); }
body.embed .win { padding-top: 7vh; padding-bottom: 7vh; }
body.embed .toast { bottom: calc(var(--vis-bottom, 0px) + 14px); }
body.embed .popup { top: calc(var(--vis-top, 0px) + 70px); }
#checkin:empty { display: none; }
#checkin { padding: 10px 12px; border-radius: 14px; border: 1px solid var(--line); background: linear-gradient(180deg, var(--panel), #120d1b); }
.pulse-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.ptile.light-tile { --pc: var(--gold); }
.map-wrap { position: relative; width: 100%; aspect-ratio: 1; border-radius: 16px; overflow: hidden; background: #120e1d; }
#map { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: manipulation; }
.map-empty { position: absolute; left: 50%; top: 58%; transform: translateX(-50%); width: min(300px, 80%); text-align: center; padding: 14px; border-radius: 14px; background: rgba(13, 10, 20, .9); border: 1px solid var(--line-2); display: grid; gap: 10px; justify-items: center; }
.map-empty p { margin: 0; }
.map-key { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; font: 700 12px/1 var(--font-hud); letter-spacing: .04em; color: var(--smog); }
.actions3 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.stash-btn { position: relative; }
.stash-btn em { position: absolute; top: 5px; right: 6px; min-width: 22px; padding: 3px 5px; border-radius: 999px; background: var(--gold); color: #3d2300; font: 900 13px/1 var(--font-display); font-style: normal; letter-spacing: 0; }
.stash-btn.bump { animation: bump .5s var(--snap); }
.act3 { display: grid; justify-items: center; gap: 4px; min-height: 70px; padding: 8px 4px; border-radius: 14px; border: 2px solid var(--line-2); background: rgba(255, 255, 255, .04); font: 800 14px/1 var(--font-hud); letter-spacing: .1em; text-transform: uppercase; }
.act3 span { font-size: 26px; line-height: 1; }
.act3:active { transform: translateY(2px); }
.act3.bail { border: 3px solid transparent; background: linear-gradient(#22100f, #22100f) padding-box, var(--stripes) border-box; color: #ffd400; }

/* missions */
.mission { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 11px 12px; border-radius: 14px; background: linear-gradient(90deg, rgba(255, 209, 102, .12), rgba(255, 255, 255, .02)); border-left: 4px solid var(--gold); }
.mission.self { border-left-color: var(--palm); background: linear-gradient(90deg, rgba(46, 230, 200, .12), rgba(255, 255, 255, .02)); }
.mission .mk { font: 800 11px/1 var(--font-hud); letter-spacing: .24em; color: var(--gold); text-transform: uppercase; }
.mission.self .mk { color: var(--palm); }
.mission b { display: block; font: 900 21px/1.05 var(--font-display); text-transform: uppercase; overflow-wrap: anywhere; }
.mission .mbtns { display: flex; gap: 6px; }

  const ids = new Set();

  for (const h of data.homies){ ids.add(h.id); for (const l of h.log) ids.add(l.id); for (const r of h.receipts) ids.add(r.id); }
  for (const m of data.missions) ids.add(m.id);

function track(){
  const now = Date.now(), ids = allIds();
  if (!data.gone) data.gone = {};

    for (const id of knownIds) if (!ids.has(id)) data.gone[id] = data.gone[id] || now;
    for (const id of ids) if (data.gone[id]) delete data.gone[id];
  }
  knownIds = ids;

    const {log, receipts, editedAt, ...rest} = x, k = JSON.stringify(rest);

      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(n.x, n.y, rr, 0, TAU); ctx.fill();
      ctx.save(); ctx.strokeStyle = `rgba(${col},${.75 * fade})`; ctx.lineWidth = strong ? 2.5 : 1.5;

    ctx.setLineDash([]);

/* ---------- the stash jar ---------- */
const Jar = (() => {
  let cv = null, ctx = null;
  const paths = Object.fromEntries(Object.entries(LOOT).map(([k, L]) => [k, {body: new Path2D(L.path), detail: new Path2D(L.detail)}]));
  const body = new Path2D('M60 46 L60 56 Q20 64 20 96 L20 230 Q20 246 36 246 L164 246 Q180 246 180 230 L180 96 Q180 64 140 56 L140 46 Z');
  let anim = null, raf = 0;
  function drawItem(it, y){
    const s = it.r * 2 / 24, L = LOOT[it.kind];
    ctx.save(); ctx.translate(it.x, y); ctx.rotate(it.rot); ctx.scale(s, s); ctx.translate(-12, -12);
    ctx.fillStyle = L.fill; ctx.strokeStyle = L.edge; ctx.lineWidth = 1.6; ctx.lineJoin = 'round';
    ctx.fill(paths[it.kind].body); ctx.stroke(paths[it.kind].body);
    ctx.lineWidth = 1.3; ctx.lineCap = 'round'; ctx.stroke(paths[it.kind].detail);
    ctx.restore();
    if (it.gold){ ctx.fillStyle = '#fff'; ctx.font = `${Math.round(it.r * .8)}px sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('✦', it.x + it.r * .7, y - it.r * .7); }
  }
  function draw(now){
    if (!cv || !cv.isConnected) return;
    const W = cv.clientWidth; if (!W) return;
    const dpr = Math.min(2, devicePixelRatio || 1), H = W * 1.25;
    if (cv.width !== Math.round(W * dpr)){ cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); }
    const k = W / 200;
    ctx.setTransform(dpr * k, 0, 0, dpr * k, 0, 0);
    ctx.clearRect(0, 0, 200, 250);
    const jar = STASH.jars[STASH.jars.length - 1];
    // glass
    ctx.fillStyle = 'rgba(255,255,255,.04)'; ctx.fill(body);
    ctx.save(); ctx.clip(body);
    for (const it of jar){
      if (anim && it.id === anim.id){
        const t = clamp((now - anim.t0) / 750, 0, 1), e = t < .7 ? Math.pow(t / .7, 2) : 1 - Math.sin((t - .7) / .3 * Math.PI) * .06;
        drawItem(it, lerp(20, it.y, Math.min(1, e)) + (t >= .7 ? -Math.sin((t - .7) / .3 * Math.PI) * 6 : 0));
      } else drawItem(it, it.y);
    }
    ctx.restore();
    ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(236,222,255,.4)'; ctx.stroke(body);
    ctx.fillStyle = 'rgba(255,255,255,.1)'; ctx.beginPath(); ctx.roundRect ? ctx.roundRect(30, 96, 9, 120, 5) : ctx.rect(30, 96, 9, 120); ctx.fill();
    // lid
    const g = ctx.createLinearGradient(0, 26, 0, 46); g.addColorStop(0, '#ffe08f'); g.addColorStop(1, '#e0a020');
    ctx.fillStyle = g; ctx.strokeStyle = '#05040a'; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.roundRect ? ctx.roundRect(52, 26, 96, 22, 6) : ctx.rect(52, 26, 96, 22); ctx.fill(); ctx.stroke();
    if (!jar.length){ ctx.fillStyle = 'rgba(236,222,255,.35)'; ctx.font = '800 15px "Barlow Condensed", sans-serif'; ctx.textAlign = 'center'; ctx.fillText('EMPTY JAR', 100, 150); }
  }
  function frame(now){ raf = 0; draw(now); if (anim && now - anim.t0 < 800) raf = requestAnimationFrame(frame); else anim = null; }
  addEventListener('resize', () => { if (cv && cv.isConnected && !raf) raf = requestAnimationFrame(frame); });
  // draw the jar in the open stash sheet; drop the newest piece in if it's new since you last looked
  function show(dropNewest){
    cv = $('#jar'); if (!cv) return;
    ctx = cv.getContext('2d');
    const jar = STASH.jars[STASH.jars.length - 1], newest = jar.length ? jar[jar.length - 1].id : null;
    anim = dropNewest && newest && !reduceMotion.matches ? {id: newest, t0: performance.now() + 250} : null;
    cancelAnimationFrame(raf); raf = requestAnimationFrame(frame);
  }
  return {show};
})();

/* missions: a few fresh ones each day, plus any you add or spin */
function ensureMissions(){
  const today = dayKey();
  data.missions = data.missions
    .filter(m => m.done || m.date === today || (!m.auto && m.type !== 'noreply' && !m.skipped))
    .filter(m => !m.homieId || byId(m.homieId));
  if (data.missionsDay === today) return;
  data.missionsDay = today;
  refresh();
  const out = [], seen = new Set(data.missions.filter(m => !m.done && !m.skipped).map(m => m.homieId));
  const add = (type, h) => { if (out.length >= 3 || seen.has(h.id)) return; seen.add(h.id); out.push(newMission(type, h.id, `${MISSION_TYPES[type].label} ${first(h)}`, true)); };
  const hs = data.homies.filter(h => !h.silent), a = h => A.get(h.id);
  const since = h => a(h).last ? Date.now() - a(h).last.at : Infinity;
  hs.filter(h => a(h).stars >= 3 || (a(h).status === 'toxic' && since(h) < 3 * DAY)).forEach(h => add('noreply', h));
  hs.filter(h => !layingLow(h) && h.toxic === null && (crewOf(h).name.toLowerCase().includes('parent') || PARENT_NAMES.test(first(h))) && since(h) > 10 * DAY).forEach(h => add('call', h));
  hs.filter(h => !layingLow(h) && a(h).status === 'golden' && since(h) > 7 * DAY).sort((x, y) => since(y) - since(x)).forEach(h => add('nurture', h));
  hs.filter(h => !layingLow(h) && ['golden', 'dope'].includes(a(h).status) && since(h) > 14 * DAY).sort((x, y) => since(y) - since(x)).forEach(h => add('catchup', h));
  hs.filter(h => !layingLow(h) && a(h).status === 'neutral' && since(h) > 21 * DAY).sort((x, y) => since(y) - since(x)).forEach(h => add('checkin', h));
  data.missions.push(...out);
  save();
}

/* ---------- the lucky wheel (a button, not the main thing) ---------- */
const Wheel = (() => {
  let cv, ctx, box, pointer, S = 0, dpr = 1, segs = [], rot = 0, flash = -1, spinning = false;
  const weight = h => { const a = A.get(h.id), d = a.last ? Math.min(60, daysBetween(a.last.at, Date.now())) : 30; return (1 + d / 5) * ({golden: 3, dope: 1.3}[a.status] || 1); };
  const eligible = () => data.homies.filter(h => !away(h) && RANGE.has(h.id) && !['watch', 'toxic'].includes(A.get(h.id).status));
  function mount(){
    box = $('#wheel-box'); cv = $('#wheel'); if (!cv) return;
    ctx = cv.getContext('2d'); pointer = $('#pointer');
    for (let i = 0; i < 24; i++){ const b = document.createElement('span'); b.className = 'bulb' + (i % 2 ? ' odd' : ''); b.style.setProperty('--a', `${i * 15}deg`); box.appendChild(b); }
    segs = eligible().sort((a, b) => weight(b) - weight(a)).slice(0, 12).sort((a, b) => a.createdAt - b.createdAt);
    S = Math.round(cv.clientWidth); dpr = Math.min(2, devicePixelRatio || 1);
    cv.width = cv.height = Math.round(S * dpr);
    box.style.setProperty('--r', `${box.clientWidth / 2 - 7}px`);
    rot = 0; draw();
  }
  function draw(){
    const c = S / 2, n = Math.max(segs.length, 1), seg = TAU / n;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, S, S);
    for (let i = 0; i < n; i++){
      const a = rot + i * seg - Math.PI / 2;
      ctx.beginPath(); ctx.moveTo(c, c); ctx.arc(c, c, c, a - seg / 2, a + seg / 2); ctx.closePath();
      let ci = i % SEG_COLORS.length; if (i === n - 1 && ci === 0 && n > 1) ci = 2;
      ctx.fillStyle = SEG_COLORS[ci]; ctx.fill();
      if (i === flash){ ctx.fillStyle = 'rgba(255,255,255,.55)'; ctx.fill(); }
      ctx.strokeStyle = 'rgba(20,6,40,.35)'; ctx.lineWidth = 2; ctx.stroke();
      if (!segs[i]) continue;
      ctx.save(); ctx.translate(c, c); ctx.rotate(a); ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
      ctx.font = `800 ${Math.round(clamp(Math.min(S / 18, seg * c * .42), 10, 19))}px "Barlow Condensed", sans-serif`; ctx.fillStyle = '#160a26';
      const nm = first(segs[i]).toUpperCase();
      ctx.fillText(`${nm.length > 9 ? nm.slice(0, 8) + '…' : nm}  ${segs[i].emoji}`, c - 12, 1); ctx.restore();
    }
    ctx.beginPath(); ctx.arc(c, c, c * .2, 0, TAU); ctx.fillStyle = '#1f1236'; ctx.fill();
  }
  const atPointer = () => { const n = segs.length; return ((Math.round(-rot / (TAU / n)) % n) + n) % n; };
  function spin(done){
    if (spinning || segs.length < 2) return;
    const total = segs.reduce((s, h) => s + weight(h), 0);
    let x = Math.random() * total, i = 0;
    while (i < segs.length - 1 && (x -= weight(segs[i])) > 0) i++;
    spinning = true; flash = -1; box.classList.add('spinning');
    const n = segs.length, seg = TAU / n, target = -i * seg + (Math.random() - .5) * seg * .6;
    const delta = (((target - rot) % TAU) + TAU) % TAU, turns = delta + TAU * (reduceMotion.matches ? 1 : 5 + Math.floor(Math.random() * 2));
    const from = rot, dur = reduceMotion.matches ? 700 : 4600, t0 = performance.now();
    let last = atPointer();
    Sound.play('whoosh');
    const step = () => {
      if (!cv.isConnected){ spinning = false; return; }
      const k = Math.min(1, (performance.now() - t0) / dur);
      rot = from + turns * (1 - Math.pow(1 - k, 4));
      const now = atPointer();
      if (now !== last){ last = now; Sound.play('tick'); pointer.classList.remove('flick'); void pointer.offsetWidth; pointer.classList.add('flick'); }
      draw();
      if (k < 1){ requestAnimationFrame(step); return; }
      box.classList.remove('spinning');
      let blinks = 0;
      const blink = () => { flash = blinks % 2 ? -1 : i; draw(); if (++blinks < 7) setTimeout(blink, 110); else { flash = -1; spinning = false; draw(); done(segs[i]); } };
      blink();
    };
    requestAnimationFrame(step);
  }
  return {mount, spin, eligible, get spinning(){ return spinning; }};
})();

function logInteraction(id, kind, hit, {need = null} = {}){
  const h = byId(id); if (!h || !KINDS[kind]) return;
  const before = A.get(h.id), respBefore = playerRespect(), batBefore = BAT, jarsBefore = STASH.full;
  const entry = {id: uid('l'), at: Date.now(), kind, hit: hit || null, tox: !!h.toxic, need: NEEDS[need] ? need : null};
  h.log.unshift(entry);
  const receipts = [...pendingReceipts].map(text => ({id: uid('r'), at: Date.now(), text, tone: RECEIPTS.good.includes(text) ? 1 : RECEIPTS.bad.includes(text) ? -1 : 0}));
  h.receipts.unshift(...receipts);
  pendingReceipts = new Set();
  // missions this completes
  const passed = data.missions.filter(m => !m.done && !m.skipped && m.homieId === h.id && MISSION_TYPES[m.type] && MISSION_TYPES[m.type].kinds.includes(kind));
  for (const m of passed){ m.done = Date.now(); m.doneBy = entry.id; }
  save(); closeSheet(); renderAll();
  const after = A.get(h.id), gained = playerRespect() - respBefore;
  Bridge.send({type: 'hit', homieId: h.id, name: h.name, crew: crewOf(h).name, kind, hit: hit || null, status: after.status, heat: after.stars});
  if (hit) Sound.play(hit);
  vibrate(hit === 'bad' ? [120, 60, 120] : hit === 'golden' ? [30, 30, 60] : 20);
  if (hit === 'golden') Confetti.burst(30, {gold: true});
  const batD = BAT.level - batBefore.level, batTxt = batD ? ` · 🔋${batD > 0 ? '+' : ''}${batD}%` : '';
  if (gained > 0) popup(`Respect +${gained}${batTxt}`, 'var(--gold)');
  else if (after.stars > before.stars) popup(`Heat ${'★'.repeat(after.stars)}${batTxt}`, '#fff');
  else if (batD) popup(`🔋 ${batD > 0 ? '+' : ''}${batD}%`, batD > 0 ? 'var(--cash)' : '#ff9b3d');
  if (isLoot(entry)) setTimeout(() => { popup(`+1 ${LOOT[kind].label}`, LOOT[kind].fill); const sb = $('#stash-btn'); sb.classList.remove('bump'); void sb.offsetWidth; sb.classList.add('bump'); }, 950);
  if (BAT.band.key !== batBefore.band.key && BAT.checked) setTimeout(() => popup(`${BAT.band.icon} ${BAT.band.label} battery now`, BAT.band.color), 1900);
  if (STASH.full > jarsBefore) Win.push({type: 'jar', n: STASH.full});
  if (entry.tox) Win.push({type: 'cloud', id: h.id, before: before.cloud, after: after.cloud, calm: after.calm, hit, need: entry.need});
  for (const m of passed) Win.push({type: 'mission', mission: m});
  if (after.status !== before.status) Win.push({type: 'status', id: h.id, from: before.status, to: after.status});
  if (after.stars >= 3 && after.stars > before.stars) Win.push({type: 'heat', id: h.id});
  const undo = () => {
    const g = byId(id); if (!g) return;
    g.log = g.log.filter(l => l.id !== entry.id);
    const rids = new Set(receipts.map(r => r.id)); g.receipts = g.receipts.filter(r => !rids.has(r.id));
    for (const m of data.missions) if (m.doneBy === entry.id){ m.done = 0; m.doneBy = null; }
    if (g.toxic && g.toxic.by === entry.id) g.toxic = null; // the hit that made them Toxic is gone, so is the lock
    save(); renderAll();
  };
  const msg = (entry.tox ? `Dealt with ${first(h)} (${KINDS[kind].label.toLowerCase()})` : KINDS[kind].did.replace('{n}', first(h))) + (hit ? ' · ' + HITS[hit].emoji : '');
  if (Win.showing) Win.onEmpty = () => toast(msg, {undo}); else toast(msg, {undo});
}

function breathe(){

    const used = new Set(data.homies.map(h => h.emoji)), free = EMOJIS.filter(e => !used.has(e)), id = uid('h'), pool = free.length ? free : EMOJIS;

  Sound.play('pop'); vibrate(15);
  const c = data.crews.find(x => x.id === crewId) || data.crews[0];
  toast(added.length === 1 ? `${first(added[0])} moved into the Hood (${c.name})` : `${added.length} homies moved into the Hood (${c.name})`, {undo: () => {
    const ids = new Set(added.map(h => h.id)); data.homies = data.homies.filter(h => !ids.has(h.id)); save(); renderAll();
  }});
  return true;
}
function removeHomie(id){
  const h = byId(id); if (!h) return;
  const kept = A.get(h.id).respect, missions = data.missions.filter(m => m.homieId === h.id);
  const loot = h.log.filter(isLoot).map(l => ({id: l.id, kind: l.kind, at: l.at, gold: l.hit === 'golden'}));
  data.stash.push(...loot); // their loot stays in your stash
  data.homies = data.homies.filter(x => x !== h);
  data.missions = data.missions.filter(m => m.homieId !== h.id);
  data.kept += kept; // your respect stays yours
  save(); closeSheet(); renderAll();
  toast(`${first(h)} left the Hood.`, {undo: () => { data.homies.push(h); data.missions.push(...missions); const ids = new Set(loot.map(x => x.id)); data.stash = data.stash.filter(x => !ids.has(x.id)); data.kept = Math.max(0, data.kept - kept); save(); renderAll(); }});
}

/* ---------- backup ---------- */
async function backup(){
  const json = JSON.stringify({app: 'homies-hood', version: 1, exportedAt: new Date().toISOString(), ...data}, null, 2);
  const filename = `the-hood-backup-${dayKey()}.json`;
  try {
    const file = new File([json], filename, {type: 'application/json'});
    if (matchMedia('(pointer: coarse)').matches && navigator.canShare && navigator.canShare({files: [file]})){ await navigator.share({files: [file], title: 'The Hood backup'}); toast('Backup shared. Keep it somewhere safe.'); return; }
  } catch (e) { if (e && e.name === 'AbortError') return; }
  const url = URL.createObjectURL(new Blob([json], {type: 'application/json'}));
  const a = document.createElement('a'); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 3000);
  toast('Backup downloaded.');
}
function restore(text){
  let incoming = null, p = null;
  try {
    p = JSON.parse(text);
    if (p && Array.isArray(p.crews)) for (const c of p.crews.map(normCrew).filter(Boolean)) if (!data.crews.some(x => x.id === c.id)) data.crews.push(c);
    if (p && p.app === 'homies-hood' && Array.isArray(p.homies)) incoming = p.homies.map(normHomie);
    else if (p && Array.isArray(p.homies)) incoming = p.homies.map(fromOld);
    else if (p && Array.isArray(p.friends)) incoming = p.friends.map(fromOld);
    else if (Array.isArray(p)) incoming = p.map(fromOld);
  } catch (e) {}
  if (!incoming){ toast("That isn't a Hood, Homies or Friend Orbit backup. Nothing changed."); return; }
  let added = 0, merged = 0;
  for (const h of incoming.filter(Boolean)){
    const cur = byId(h.id) || data.homies.find(x => x.name.toLowerCase() === h.name.toLowerCase());
    if (!cur){ data.homies.push(h); added++; continue; }
    const ids = new Set(cur.log.map(l => l.id)), extra = h.log.filter(l => !ids.has(l.id));
    const rids = new Set(cur.receipts.map(r => r.id)), extraR = h.receipts.filter(r => !rids.has(r.id));
    if (extra.length || extraR.length){ cur.log = [...cur.log, ...extra].sort((a, b) => b.at - a.at); cur.receipts = [...cur.receipts, ...extraR].sort((a, b) => b.at - a.at); merged++; }
  }
  if (p && Array.isArray(p.missions)) for (const m of p.missions.map(normMission).filter(Boolean)) if (!data.missions.some(x => x.id === m.id)) data.missions.push(m);
  if (p && Number.isFinite(p.kept) && p.app === 'homies-hood') data.kept = Math.max(data.kept, p.kept);
  fixCrews(); save(); renderAll();
  toast(added || merged ? `Restored: ${added} new ${added === 1 ? 'homie' : 'homies'}${merged ? `, ${merged} updated` : ''}.` : 'Everyone in that backup is already here.');
}

/* ---------- Cloud sync (optional) ---------- */
// Firebase's free tier: Google sign-in plus one small document per person at homies/{uid}, in the same
// project as Mission Board and Ezycal, so one sign-in covers all three. It switches on only when
// firebase-config.js has the project's settings. Changes from every device are merged, never overwritten:
// homies, hits, receipts, missions and loot are joined by id, the newest edit wins for a homie's details,
// and anything deleted stays deleted (see track()).
const Sync = (() => {
  const cfg = window.MISSION_BOARD_FIREBASE;
  const FB = 'https://www.gstatic.com/firebasejs/10.12.2/';
  const deviceId = Math.random().toString(36).slice(2, 10); // per open page, to ignore our own echoes
  const S = {enabled: !!(cfg && cfg.apiKey), user: null, status: 'Not signed in', busy: false};
  let auth = null, docRef = null, unsub = null, ready = false, applying = false, timer = 0, starting = false;

  const setStatus = t => { S.status = t; const el = $('#sync-line'); if (el) el.textContent = t; };
  const paintBtn = () => { const b = $('#sync-btn'); if (b){ b.textContent = S.user ? 'Sign out' : '☁️ Sign in to sync'; b.disabled = S.busy; } };
  const who = () => (S.user && S.user.email) || 'your account';

  // Join two copies of the Hood into one. Pure: takes raw objects, returns the merged fields.
  function merge(mine, theirs){
    const norm = d => ({
      crews: (Array.isArray(d.crews) ? d.crews : []).map(normCrew).filter(Boolean),
      homies: (Array.isArray(d.homies) ? d.homies : []).map(normHomie).filter(Boolean),
      missions: (Array.isArray(d.missions) ? d.missions : []).map(normMission).filter(Boolean),
      stash: (Array.isArray(d.stash) ? d.stash : []).filter(x => x && LOOT[x.kind] && Number.isFinite(x.at) && okId(x.id)).map(x => ({id: x.id, kind: x.kind, at: x.at, gold: !!x.gold})),
      rests: (Array.isArray(d.rests) ? d.rests : []).filter(r => r && Number.isFinite(r.at) && Number.isFinite(r.amt)),
      battery: d.battery && typeof d.battery.date === 'string' && Number.isFinite(d.battery.level) && Number.isFinite(d.battery.at) ? {date: d.battery.date, level: clamp(d.battery.level, 0, 100), at: d.battery.at} : null,
      kept: Number.isFinite(d.kept) ? Math.max(0, d.kept) : 0,
      missionsDay: typeof d.missionsDay === 'string' ? d.missionsDay : '',
      gone: cleanGone(d.gone),
    });
    const a = norm(mine), b = norm(theirs);
    const gone = {...b.gone};
    for (const [k, t] of Object.entries(a.gone)) gone[k] = Math.max(gone[k] || 0, t);
    const alive = x => !gone[x.id];
    const newest = (x, y) => y && y.editedAt > x.editedAt ? y : x;
    const joinById = (xs, ys) => { const m = new Map(); for (const x of [...xs, ...ys]) if (!m.has(x.id)) m.set(x.id, x); return [...m.values()]; };

    const crews = [];
    for (const c of joinById(a.crews, b.crews)) if (alive(c)) crews.push(newest(a.crews.find(x => x.id === c.id) || c, b.crews.find(x => x.id === c.id)));

    const hm = new Map();
    for (const h of [...a.homies, ...b.homies]){
      if (!alive(h)) continue;
      const mineH = a.homies.find(x => x.id === h.id), theirH = b.homies.find(x => x.id === h.id);
      const base = mineH && theirH ? newest(mineH, theirH) : (mineH || theirH);
      hm.set(h.id, {...base,
        log: joinById(mineH ? mineH.log : [], theirH ? theirH.log : []).filter(alive).sort((x, y) => y.at - x.at),
        receipts: joinById(mineH ? mineH.receipts : [], theirH ? theirH.receipts : []).filter(alive).sort((x, y) => y.at - x.at)});
    }
    // Names are unique in the Hood, so the same name added on two devices is the same person.
    const remap = new Map(), byName = new Map();
    for (const h of [...hm.values()].sort((x, y) => x.createdAt - y.createdAt || (x.id < y.id ? -1 : 1))){
      const k = h.name.toLowerCase(), keep = byName.get(k);
      if (!keep){ byName.set(k, h); continue; }
      keep.log = joinById(keep.log, h.log).sort((x, y) => y.at - x.at);
      keep.receipts = joinById(keep.receipts, h.receipts).sort((x, y) => y.at - x.at);
      remap.set(h.id, keep.id); hm.delete(h.id);
    }
    const homies = [...hm.values()];
    const homieIds = new Set(homies.map(h => h.id));

    const mm = new Map();
    for (const m of [...a.missions, ...b.missions]){
      const o = mm.get(m.id);
      if (!o){ mm.set(m.id, {...m}); continue; }
      if (m.done && (!o.done || m.done < o.done)){ o.done = m.done; o.doneBy = m.doneBy; }
      o.skipped = o.skipped || m.skipped;
    }
    // Each device makes its own daily missions, so the same one can turn up twice: keep a single copy.
    const seen = new Map();
    for (const m of [...mm.values()].sort((x, y) => (y.done ? 1 : 0) - (x.done ? 1 : 0) || (x.id < y.id ? -1 : 1))){
      if (remap.has(m.homieId)) m.homieId = remap.get(m.homieId);
      if (!m.auto) continue;
      const k = [m.type, m.homieId, m.date, m.text].join('|');
      if (seen.has(k)) mm.delete(m.id); else seen.set(k, m.id);
    }
    const missions = [...mm.values()].filter(m => alive(m) && (!m.homieId || homieIds.has(m.homieId))).sort((x, y) => (x.date < y.date ? -1 : x.date > y.date ? 1 : x.id < y.id ? -1 : 1)).slice(-600);

    const stash = joinById(a.stash, b.stash).filter(alive).sort((x, y) => x.at - y.at).slice(-3000);
    const rests = [...new Map([...a.rests, ...b.rests].map(r => [r.at + ':' + r.amt, r])).values()].sort((x, y) => x.at - y.at).slice(-200);
    const battery = a.battery && b.battery ? (b.battery.at > a.battery.at ? b.battery : a.battery) : (a.battery || b.battery);
    return {crews, homies, missions, stash, rests, battery, kept: Math.max(a.kept, b.kept), missionsDay: a.missionsDay > b.missionsDay ? a.missionsDay : b.missionsDay, gone: cleanGone(gone)};
  }
  // A stable fingerprint, so two devices can tell when they already agree and stop writing.
  function canon(v){
    if (Array.isArray(v)){
      const xs = v.map(canon);
      return v.length && v[0] && typeof v[0] === 'object' ? xs.sort((x, y) => { const p = JSON.stringify(x), q = JSON.stringify(y); return p < q ? -1 : p > q ? 1 : 0; }) : xs;
    }
    if (v && typeof v === 'object') return Object.fromEntries(Object.keys(v).sort().map(k => [k, canon(v[k])]));
    return v;
  }
  const fingerprint = d => JSON.stringify(canon(merge(d, {})));

  function apply(remote, quiet){
    const before = fingerprint(data);
    const m = merge(data, remote);
    applying = merging = true;
    try { Object.assign(data, m); fixCrews(); save(); } finally { applying = merging = false; }
    const changed = fingerprint(data) !== before;
    if (changed){ renderAll(); if (!quiet) toast('Synced from your other device.'); }
    if (fingerprint(data) !== fingerprint(remote)) schedule(1500);
    else setStatus(`Synced · ${who()}`);
  }

  function schedule(delay = 7000){ // a little over the 6s Undo window, so an undone hit never reaches the cloud
    if (!ready || applying) return;
    clearTimeout(timer);
    timer = setTimeout(push, delay);
    setStatus('Saving…');
  }
  async function push(){
    if (!ready) return;
    const json = JSON.stringify(data);
    if (json.length > 900000){ setStatus('Too big to sync · back up and remove old history'); return; }
    try { await docRef.set({data: json, device: deviceId, updatedAt: Date.now()}); setStatus(`Synced · ${who()}`); }
    catch (e) { setStatus("Sync failed · it'll retry on your next change"); }
  }
  const parse = v => { try { return v && typeof v.data === 'string' ? JSON.parse(v.data) : null; } catch (e) { return null; } };

  async function start(){
    if (starting) return;
    starting = true;
    docRef = firebase.firestore().collection('homies').doc(S.user.uid);
    setStatus('Syncing…');
    const slow = setTimeout(() => { if (!ready) setStatus('Still connecting · if this stays, allow this site in your ad or tracker blocker'); }, 15000);
    try {
      const snap = await docRef.get();
      clearTimeout(slow);
      ready = true;
      const remote = snap.exists ? parse(snap.data()) : null;
      if (remote) apply(remote, true); else await push();
      unsub = docRef.onSnapshot(s => {
        if (!s.exists || (s.metadata && s.metadata.hasPendingWrites)) return;
        const v = s.data(), r = parse(v);
        if (!r || v.device === deviceId) return;
        apply(r, false);
      }, () => setStatus('Sync paused · reload to reconnect'));
    } catch (e) {
      clearTimeout(slow);
      ready = false;
      const code = (e && e.code) || 'unknown';
      setStatus(code === 'permission-denied' ? 'Sync blocked · add the homies rule in Firestore (see README)'
        : code === 'unavailable' ? "Can't reach the database · check your connection or ad blocker, then reload"
        : `Sync failed (${code}) · reload to try again`);
    } finally { starting = false; }
  }
  function stop(){ ready = false; clearTimeout(timer); if (unsub) unsub(); unsub = null; }

  const loadScript = src => new Promise((resolve, reject) => {
    const el = document.createElement('script');
    el.src = src; el.onload = resolve; el.onerror = () => reject(new Error('Could not load ' + src));
    document.head.append(el);
  });
  async function init(){
    S.busy = true; paintBtn(); setStatus('Connecting…');
    try {
      await loadScript(FB + 'firebase-app-compat.js');
      await loadScript(FB + 'firebase-auth-compat.js');
      await loadScript(FB + 'firebase-firestore-compat.js');
      firebase.initializeApp(cfg);
      auth = firebase.auth();
      auth.onAuthStateChanged(u => {
        S.user = u; S.busy = false; paintBtn();
        if (u) start(); else { stop(); setStatus('Not signed in · this device keeps its own copy'); }
      });
    } catch (e) { S.busy = false; paintBtn(); setStatus("Couldn't reach the sync service · tap to retry"); }
  }
  async function click(){
    if (!auth){ init(); return; }
    if (S.user){ await auth.signOut(); toast('Signed out · this device keeps its copy.'); return; }
    const provider = new firebase.auth.GoogleAuthProvider();
    try { await auth.signInWithPopup(provider); }
    catch (e) {
      const code = (e && e.code) || '';
      if (code === 'auth/popup-blocked' || code === 'auth/operation-not-supported-in-this-environment') auth.signInWithRedirect(provider);
      else if (code !== 'auth/popup-closed-by-user' && code !== 'auth/cancelled-popup-request') toast("Sign-in didn't finish.");
    }
  }
  if (S.enabled){
    onSaved = () => schedule();
    setTimeout(init, 800); // after the first paint
  }
  return Object.assign(S, {click, merge, fingerprint, paintBtn});
})();

/* ---------- Mission Possible bridge (inside the board via ?embed=1) ---------- */
// Inside Mission Possible Plus: work out which part of The Hood is actually on screen (the frame can be
// taller than the screen, and the Plus top bar covers its top), and keep sheets and pop-ups in there.
if (EMBED && window.frameElement){
  try {
    const fr = window.frameElement, root = document.documentElement;
    if (parent.document.getElementById('hood-panel')){ document.body.classList.add('in-plus'); $('#fs-btn').hidden = false; }
    const fitView = () => {
      try {
        const r = fr.getBoundingClientRect(), cover = +(fr.dataset.coverTop || 0);
        const top = clamp(cover - r.top, 0, innerHeight), bottom = clamp(parent.innerHeight - r.top, 0, innerHeight);
        root.style.setProperty('--vis-top', `${Math.round(top)}px`);
        root.style.setProperty('--vis-bottom', `${Math.round(Math.max(0, innerHeight - bottom))}px`);
        root.style.setProperty('--vis-h', `${Math.round(Math.max(240, bottom - top))}px`);
      } catch (e) {}
    };
    parent.addEventListener('scroll', fitView, {passive: true});
    parent.addEventListener('resize', fitView);
    addEventListener('resize', fitView);
    new MutationObserver(fitView).observe(fr, {attributes: true});
    fitView();
  } catch (e) {}
}
addEventListener('message', e => {
  if (!EMBED || e.origin !== location.origin || e.source !== window.parent) return;
  const d = e.data;
  if (d && d.source === 'mission-possible' && d.type === 'fullscreen-state'){
    const b = $('#fs-btn');
    b.setAttribute('aria-label', d.on ? 'Shrink' : 'Full screen');
    b.innerHTML = `<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${d.on ? 'M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5' : 'M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5'}"/></svg>`;
  }
});
const Bridge = { send(msg){ if (!EMBED || window.parent === window) return; try { window.parent.postMessage(Object.assign({source: 'homies', v: 4}, msg), location.origin); } catch (e) {} } };

/* ---------- toast ---------- */
let toastTimer = 0, toastUndo = null;
function toast(msg, {undo} = {}){
  const el = $('#toast');
  toastUndo = undo || null;
  el.innerHTML = `<span>${esc(msg)}</span>${undo ? '<button data-act="undo">Undo</button>' : ''}`;
  el.hidden = false; el.style.animation = 'none'; void el.offsetWidth; el.style.animation = '';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.hidden = true; toastUndo = null; }, undo ? 6000 : 3000);
}
function announce(msg){ const a = $('#announcer'); a.textContent = ''; setTimeout(() => { a.textContent = msg; }, 30); }
async function copyText(text){
  try { await navigator.clipboard.writeText(text); return true; }
  catch (e) { try { const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select(); const ok = document.execCommand('copy'); ta.remove(); return ok; } catch (e2) { return false; } }
}
// tap-to-choose inside a sheet form: set the hidden field and mark the chosen chip
function choose(t, field, attr = 'aria-checked'){
  const form = t.closest('form'); if (!form) return null;
  form.elements[field].value = t.dataset.v;
  t.parentElement.querySelectorAll(`[data-act="${t.dataset.act}"]`).forEach(b => b.setAttribute(attr, String(b === t)));
  Sound.play('tap');
  return form;
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  if (!$('#win').hidden && e.target.closest('#win')){
    const b = e.target.closest('[data-act]'), act = b && b.dataset.act;
    if (act === 'breathe'){ Win.queue.unshift({type: 'breathe'}); Win.next(); return; }
    if (act === 'win-laylow'){ const h = byId(b.dataset.id); Win.next(); if (h) setLayLow(h, 1); return; }
    if (act === 'win-bail'){ const id = b.dataset.id; Win.queue = []; Win.next(); bail(id); return; }
    if (act === 'win-safe'){ Win.queue = []; Win.next(); setSafehouse(true); return; }
    if (act === 'win-silence'){ const h = byId(b.dataset.id); Win.next(); if (h) setSilent(h, true); return; }
    if (act === 'win-noreply'){
      const h = byId(b.dataset.id);
      if (h && !data.missions.some(m => !m.done && !m.skipped && m.type === 'noreply' && m.homieId === h.id)){ data.missions.push(newMission('noreply', h.id, `Don't reply to ${first(h)} tonight`)); save(); renderAll(); }
      Win.next(); toast("Mission added. Tick it off once tonight's done. 🛡️"); return;
    }
    if (e.target.closest('.breath')) return;
    Win.collect(); return;
  }
  const t = e.target.closest('[data-act]');
  if (!t) return;
  const {act, id, v} = t.dataset;
  const h = id ? byId(id) : null;
  switch (act){
    case 'open': Sound.play('tap'); homieSheet(id); break;
    case 'close-sheet': closeSheet(); break;
    case 'add': Sound.play('tap'); if (prefs.safehouse) setSafehouse(false); addSheet(); break;
    case 'menu': Sound.play('tap'); menuSheet(); break;
    case 'safehouse': setSafehouse(!prefs.safehouse); break;
    case 'wheel': Sound.play('tap'); wheelSheet(); break;
    case 'stash': Sound.play('tap'); stashSheet(); break;
    case 'fullscreen': Bridge.send({type: 'fullscreen'}); break;
    case 'spin': doSpin(); break;
    case 'bail': bail(id); break;
    case 'breathe': Win.push({type: 'breathe'}); break;
    case 'focus': {
      const g = pulseGroups().find(x => x.key === v);
      focus = g && !(focus && focus.key === v) ? {key: v, ids: new Set(g.list.map(x => x.id))} : null;
      Sound.play('tap'); renderPulse(); renderHomies(); Hood.kick();
      break;
    }
    case 'crew-filter': crewFilter = v; Sound.play('tap'); renderHomies(); break;
    case 'hitup': hitUpSheet(id); break;
    case 'catchup': hitSheet(id, 'saw'); break;
    case 'deal': needSheet(id); break;
    case 'need': feelSheet(id, v); break;
    case 'feel': logInteraction(id, $('#sheet').dataset.kind || 'text', v, {need: t.dataset.need}); break;
    case 'reach-safe': { const pickH = [...LIGHT.from, ...data.homies.filter(x => ['golden', 'dope'].includes(A.get(x.id).status))].find(x => !x.toxic && !away(x) && RANGE.has(x.id)) || data.homies.find(x => !x.toxic && !away(x)); if (pickH) hitUpSheet(pickH.id); else addSheet(); break; }
    case 'boundary': boundarySheet(id); break;
    case 'noreply-mission': if (h){ if (!data.missions.some(m => !m.done && !m.skipped && m.type === 'noreply' && m.homieId === h.id)){ data.missions.push(newMission('noreply', h.id, `Don't reply to ${first(h)} tonight`)); save(); renderAll(); } closeSheet(); toast("Mission added. Tick it off once tonight's done. 🛡️"); } break;
    case 'reach': setTimeout(() => hitSheet(id, t.dataset.kind), t.tagName === 'A' ? 400 : 0); break;
    case 'kind': $('#sheet').dataset.kind = v; t.parentElement.querySelectorAll('[data-act="kind"]').forEach(b => b.setAttribute('aria-checked', String(b === t))); Sound.play('tap'); break;
    case 'hit': logInteraction(id, $('#sheet').dataset.kind || 'text', v || null); break;
    case 'pre-receipt': { const on = t.getAttribute('aria-pressed') !== 'true'; t.setAttribute('aria-pressed', String(on)); if (on) pendingReceipts.add(v); else pendingReceipts.delete(v); Sound.play('tap'); break; }
    case 'receipt': if (h){ h.receipts.unshift({id: uid('r'), at: Date.now(), text: v, tone: RECEIPTS.good.includes(v) ? 1 : -1}); save(); renderAll(); reopenHomie(h.id); toast('Receipt kept. 🧾'); } break;
    case 'del-receipt': if (h){ h.receipts = h.receipts.filter(r => r.id !== v); save(); renderAll(); reopenHomie(h.id); } break;
    case 'laylow': layLowSheet(id); break;
    case 'laylow-for': if (h) setLayLow(h, +v); break;
    case 'end-laylow': if (h){ h.layLowUntil = 0; save(); closeSheet(); renderAll(); toast(`${first(h)} is back in the Hood.`); } break;
    case 'silence': silenceSheet(id); break;
    case 'silence-yes': if (h) setSilent(h, true); break;
    case 'battery': Sound.play('tap'); batterySheet(); break;
    case 'checkin': checkIn(+v); break;
    case 'rest': rest(); break;
    case 'lowbat': if (h){ h.lowBat = !onLowList(h); save(); renderAll(); if ($('#sheet [data-act="lowbat-pick"]')) batterySheet(true); else reopenHomie(h.id); Sound.play('tap'); } break;
    case 'lowbat-pick': if (h){ h.lowBat = !onLowList(h); save(); renderAll(); t.setAttribute('aria-pressed', String(onLowList(h))); t.firstChild.textContent = onLowList(h) ? '✓ ' : ''; Sound.play('tap'); } break;
    case 'mark-toxic': $('#tox-zone').innerHTML = `<p class="fine" style="margin-bottom:8px">Mark ${esc(first(h))} as Toxic for good? They'll spread radiation and only a Peak battery can handle them.</p><div class="row"><button class="btn haz small" type="button" data-act="mark-toxic-yes" data-id="${esc(id)}">☢️ Yes, Toxic</button><button class="btn ghost small" type="button" data-act="close-sheet">Not now</button></div>`; break;
    case 'mark-toxic-yes': if (h){ const was = A.get(h.id).status; h.toxic = {at: Date.now(), by: 'manual'}; save(); closeSheet(); renderAll(); Sound.play('bad'); Win.push({type: 'status', id: h.id, from: was === 'toxic' ? 'watch' : was, to: 'toxic'}); } break;
    case 'clear-toxic': if (h){ h.toxic = null; h.base = Math.max(h.base, -1); save(); renderAll(); editSheet(h.id); toast(`Toxic cleared for ${first(h)}.`); } break;
    case 'edit': editSheet(id); break;
    case 'delete': $('#del-zone').innerHTML = `<p class="fine" style="margin-bottom:8px">Remove ${esc(first(h))} and their history? You keep the respect.</p><div class="row"><button class="btn danger small" type="button" data-act="delete-yes" data-id="${esc(id)}">Yes, remove</button><button class="btn ghost small" type="button" data-act="close-sheet">Keep them</button></div>`; break;
    case 'delete-yes': removeHomie(id); break;
    case 'set-crew': choose(t, 'crewId'); break;
    case 'set-base': choose(t, 'base'); break;
    case 'set-emoji': { choose(t, 'emoji', 'aria-pressed'); const tk = $('#sheet .sh-head .tok'); if (tk) tk.textContent = v; break; }
    case 'set-mtype': choose(t, 'type'); break;
    case 'set-mwho': choose(t, 'who'); break;
    case 'new-crew': crewSheet(null, $('#add-form') ? 'add' : ''); break;
    case 'edit-crew': crewSheet(v); break;
    case 'crew-emoji': { choose(t, 'emoji', 'aria-pressed'); $('#crew-preview').textContent = v; break; }
    case 'crew-color': { choose(t, 'color', 'aria-pressed'); $('#crew-preview').style.setProperty('--sc', v); break; }
    case 'delete-crew': if (!data.homies.some(x => x.crewId === v) && data.crews.length > 1){ data.crews = data.crews.filter(c => c.id !== v); save(); renderAll(); menuSheet(); toast('Crew deleted.'); } break;
    case 'add-mission': missionSheet(); break;
    case 'mission-done': completeMission(v); break;
    case 'mission-skip': { const m = data.missions.find(x => x.id === v); if (m){ m.skipped = true; save(); renderAll(); toast('Mission skipped. No pressure.', {undo: () => { m.skipped = false; save(); renderAll(); }}); } break; }
    case 'copy': copyText(t.dataset.text || '').then(ok => toast(ok ? 'Copied. Paste it in your messages.' : "Couldn't copy. You can select the text instead.")); break;
    case 'sound': prefs.sound = !prefs.sound; savePrefs(); Sound.play('tap'); menuSheet(); break;
    case 'sync': Sync.click(); break;
    case 'backup': backup(); break;
    case 'import': $('#import-file').click(); break;
    case 'undo': { const u = toastUndo; $('#toast').hidden = true; toastUndo = null; if (u) u(); break; }
  }
});
document.addEventListener('submit', e => {
  e.preventDefault();
  const f = e.target;
  if (f.id === 'add-form') addHomies(f.elements.names.value, f.elements.crewId.value, +f.elements.base.value);
  else if (f.id === 'edit-form'){
    const h = byId(f.dataset.id); if (!h) return;
    const name = f.elements.name.value.trim().slice(0, 40); if (!name){ f.elements.name.focus(); return; }
    h.name = name; h.phone = f.elements.phone.value.trim().slice(0, 24).replace(/[^\d+()\-\s]/g, '');
    if (data.crews.some(c => c.id === f.elements.crewId.value)) h.crewId = f.elements.crewId.value;
    h.base = clamp(+f.elements.base.value || 0, -2, 2); h.emoji = f.elements.emoji.value || h.emoji;
    save(); renderAll(); homieSheet(h.id); toast('Saved.');
  } else if (f.id === 'crew-form'){
    const name = f.elements.name.value.trim().slice(0, 24); if (!name){ f.elements.name.focus(); return; }
    const c = data.crews.find(x => x.id === f.dataset.id);
    if (c){ c.name = name; c.emoji = f.elements.emoji.value; c.color = f.elements.color.value; }
    else { const nc = {id: uid('c'), name, emoji: f.elements.emoji.value, color: f.elements.color.value}; data.crews.push(nc); prefs.lastCrew = nc.id; savePrefs(); }
    save(); renderAll(); Sound.play('pop');
    if (f.dataset.back === 'add') addSheet(); else menuSheet();
    toast(c ? 'Crew saved.' : `${name} crew started.`);
  } else if (f.dataset.form === 'receipt'){
    const h = byId(f.dataset.id), text = f.querySelector('input').value.trim().slice(0, 80);
    if (!h || !text) return;
    h.receipts.unshift({id: uid('r'), at: Date.now(), text, tone: 0}); save(); renderAll(); reopenHomie(h.id); toast('Receipt kept. 🧾');
  } else if (f.dataset.form === 'laylow'){
    const h = byId(f.dataset.id), days = Math.round(+f.querySelector('input').value);
    if (h && days >= 1) setLayLow(h, Math.min(days, 365));
  } else if (f.id === 'mission-form'){
    const text = f.elements.text.value.trim().slice(0, 80), type = f.elements.type.value, who = byId(f.elements.who.value);
    if (text) data.missions.push(newMission('custom', null, text));
    else if (who) data.missions.push(newMission(type, who.id, `${MISSION_TYPES[type].label} ${first(who)}`));
    else return;
    save(); closeSheet(); renderAll(); Sound.play('pop'); toast('Mission added. 🎯');
  }
});
$('#import-file').addEventListener('change', e => {
  const file = e.target.files && e.target.files[0];
  if (file){ const r = new FileReader(); r.onload = () => restore(String(r.result || '')); r.readAsText(file); }
  e.target.value = '';
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (!$('#win').hidden){ Win.collect(); return; }
  closeSheet();
});
addEventListener('storage', e => { if (e.key === KEY){ load(); renderAll(); } });

/* ---------- boot ---------- */
load();
if (location.hash === '#safehouse'){ prefs.safehouse = true; savePrefs(); }
renderAll();
// the Hood keeps moving while you're away: refresh positions, heat and radiation every minute
setInterval(() => { if ($('#sheet').hidden && $('#win').hidden) renderAll(); }, 60000);
if ('serviceWorker' in navigator && location.protocol === 'https:' && !EMBED) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
</body>
</html>
